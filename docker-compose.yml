services:
  db:
    image: mysql:8.0
    container_name: petzigo-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-petzigo}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123}
      MYSQL_ROOT_HOST: "%"  # Permite conexiones desde cualquier host
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./backend/sql/add_mercadopago_payment_id.sql:/docker-entrypoint-initdb.d/add_mercadopago_payment_id.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petzigo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: petzigo-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=db
      - DB_PORT=3306
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/usr/src/app:cached
      - /usr/src/app/node_modules
      - uploads:/usr/src/app/uploads
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    networks:
      - petzigo-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: petzigo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_BASE=http://localhost:${BACKEND_PORT:-4000}/api
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app:cached
      - /usr/src/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    networks:
      - petzigo-net

volumes:
  db_data:
    driver: local
  uploads:
    driver: local

networks:
  petzigo-net:
    driver: bridge
