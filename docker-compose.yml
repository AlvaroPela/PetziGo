services:
  db:
    image: mysql:8.0
    container_name: petzigo-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-petzigo}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123}
      MYSQL_ROOT_HOST: "%"  # Permite conexiones desde cualquier host
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petzigo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: petzigo-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=db
      - DB_PORT=3306
    # backend no se expone directamente: las peticiones externas llegan a través del frontend (nginx)
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/usr/src/app:cached
      - /usr/src/app/node_modules
      - uploads:/usr/src/app/uploads
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    networks:
      - petzigo-net
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: petzigo-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
        VITE_API_BASE: /api
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - petzigo-net
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    

volumes:
  db_data:
    driver: local
  uploads:
    driver: local

networks:
  petzigo-net:
    driver: bridge
